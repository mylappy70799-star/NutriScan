      // ==========================================

        const [uploadedPreview, setUploadedPreview] = useState(null);
        const [cameraStreamActive, setCameraStreamActive] = useState(false);
        const [cameraError, setCameraError] = useState(null);
        const videoRef = useRef(null);
        const fileInputRef = useRef(null);

        if (!isOpen) return null;

        const startCamera = async () => {
          setActiveMode('camera');
          setCameraError(null);
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment' },
            });
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.play();
              setCameraStreamActive(true);
            }
          } catch (err) {
            console.warn('Camera access denied or unavailable:', err);
            setCameraError(
              'Camera access not granted or unavailable in this view. You can choose a sample or upload a photo!'
            );
            setCameraStreamActive(false);
          }
        };

        const stopCamera = () => {
          if (videoRef.current && videoRef.current.srcObject) {
            const stream = videoRef.current.srcObject;
            stream.getTracks().forEach((track) => track.stop());
            videoRef.current.srcObject = null;
          }
          setCameraStreamActive(false);
        };

        const handleClose = () => {
          stopCamera();
          onClose();
        };

          setIsScanning(true);

            setIsScanning(false);
            stopCamera();
            onScanComplete(mealData);
            onClose();
          }, 1200);
        };

          runScanSimulation({
            ...preset,
            id: `scan-${Date.now()}`,

              hour: '2-digit',
              minute: '2-digit',
            }),
          });

          const file = e.target.files?.[0];

              protein: Math.floor(randomCalories * 0.08),
              proteinLevel: 'High',
              carbs: Math.floor(randomCalories * 0.1),

              category: 'Lunch',

      // ==========================================
      // ROOT APP COMPONENT
      // ==========================================
      function App() {
        const [activeTab, setActiveTab] = useState('capture');
        const [currentMeal, setCurrentMeal] = useState(INITIAL_SCANNED_MEAL);
        const [meals, setMeals] = useState(INITIAL_MEALS);
        const [weeklyIntake, setWeeklyIntake] = useState(INITIAL_WEEKLY_INTAKE);
        const [dailyTargets, setDailyTargets] = useState(INITIAL_DAILY_TARGETS);
        const [dietaryPreferences, setDietaryPreferences] = useState(
          INITIAL_DIETARY_PREFERENCES
        );
        const [badges, setBadges] = useState(INITIAL_BADGES);
        const [userProfile, setUserProfile] = useState(INITIAL_USER_PROFILE);

        const handleAddToLog = (newMeal) => {
          const mealEntry = {
            ...newMeal,
            id: `meal-logged-${Date.now()}`,
            time: new Date().toLocaleTimeString([], {
              hour: '2-digit',
              minute: '2-digit',
            }),
            date: 'Today, Oct 26',
            dateKey: 'today',
          };

          setMeals((prev) => [mealEntry, ...prev]);

          setWeeklyIntake((prev) =>
            prev.map((item) => {
              if (item.day === 'Sun') {
                return {
                  ...item,
                  calories: item.calories + newMeal.calories,
                };
              }
              return item;
            })
          );
        };

        const handleSelectMealForView = (meal) => {
          setCurrentMeal(meal);
          setActiveTab('capture');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        return (
          <div className="min-h-screen bg-background text-on-background flex flex-col font-sans antialiased selection:bg-primary selection:text-white">
            <TopAppBar
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              userProfile={userProfile}
            />

            <main className="flex-grow pt-20 pb-28 md:pb-24 px-4 sm:px-6 max-w-[1200px] mx-auto w-full">
              {activeTab === 'capture' && (
                <CaptureScreen
                  currentMeal={currentMeal}
                  setCurrentMeal={setCurrentMeal}
                  onAddToLog={handleAddToLog}
                  onNavigateToLogs={() => setActiveTab('logs')}
                />
              )}

              {activeTab === 'logs' && (
                <LogsScreen
                  meals={meals}
                  weeklyIntake={weeklyIntake}
                  onSelectMealForView={handleSelectMealForView}
                />
              )}

              {activeTab === 'settings' && (
                <SettingsScreen
                  userProfile={userProfile}
                  setUserProfile={setUserProfile}
                  dailyTargets={dailyTargets}
                  setDailyTargets={setDailyTargets}
                  dietaryPreferences={dietaryPreferences}
                  setDietaryPreferences={setDietaryPreferences}
                  badges={badges}
                />
              )}

              {activeTab === 'insights' && (
                <InsightsScreen
                  dailyTargets={dailyTargets}
                  dietaryPreferences={dietaryPreferences}
                />
              )}
            </main>

            <BottomNavBar activeTab={activeTab} setActiveTab={setActiveTab} />
          </div>
        );
      }

      // Mount the React root
      const rootElement = document.getElementById('root');
      if (rootElement) {
        ReactDOM.createRoot(rootElement).render(<App />);
      }
    </script>
